# Rede de filas do Modulo 8 (imagem do enunciado), no formato do professor:
#   Fila 1 (G/G/1/3, chegadas 1..2min, atendimento 2..3min)
#     -> 20% para a Fila 2 (G/G/2/4, atendimento 3..5min)
#     -> 30% para a Fila 3 (G/G/3/5, atendimento 2..4min)
#     -> 50% sai do sistema (restante implicito, nao precisa declarar)
#
# OBS: o enunciado nao especifica explicitamente o tempo do primeiro
# cliente nem o numero de aleatorios para ESTA rede. Usamos aqui
# primeiro cliente = 1.0 (minimo do intervalo de chegada da Fila 1) e
# rndnumbersPerSeed = 100000, seguindo o mesmo padrao das etapas
# anteriores -- ajuste livremente se o professor especificar outros
# valores em algum outro lugar do modulo.
!PARAMETERS
arrivals:
  Fila1: 1.0

queues:
  Fila1:
    servers: 1
    capacity: 3
    minArrival: 1.0
    maxArrival: 2.0
    minService: 2.0
    maxService: 3.0
  Fila2:
    servers: 2
    capacity: 4
    minService: 3.0
    maxService: 5.0
  Fila3:
    servers: 3
    capacity: 5
    minService: 2.0
    maxService: 4.0

network:
-  source: Fila1
   target: Fila2
   probability: 0.2
-  source: Fila1
   target: Fila3
   probability: 0.3

seeds:
- 7
rndnumbersPerSeed: 100000
