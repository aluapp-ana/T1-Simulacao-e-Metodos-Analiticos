# Rede de filas do Modulo 8 (imagem do enunciado):
#   Fila 1 (G/G/1/3, chegadas 1..2min, atendimento 2..3min)
#     -> 20% para a Fila 2 (G/G/2/4, atendimento 3..5min)
#     -> 30% para a Fila 3 (G/G/3/5, atendimento 2..4min)
#     -> 50% sai do sistema
#
# OBS: o enunciado nao especifica explicitamente o tempo do primeiro
# cliente nem o numero de aleatorios para ESTA rede (diferente dos modulos
# anteriores, que davam esses valores). Usamos aqui primeiro_cliente=1.0
# (o minimo do intervalo de chegada da Fila 1) e limite_aleatorios=100000,
# seguindo o mesmo padrao das etapas anteriores -- ajuste livremente se o
# professor especificar valores diferentes em outro lugar do modulo.

simulacao:
  seed: 7
  limite_aleatorios: 100000

filas:
  - nome: "Fila 1"
    servers: 1
    capacity: 3
    chegada:
      min: 1
      max: 2
      primeiro_cliente: 1.0
    atendimento:
      min: 2
      max: 3
    roteamento:
      - destino: 1          # Fila 2
        probabilidade: 0.2
      - destino: 2          # Fila 3
        probabilidade: 0.3
      - destino: -1         # exterior
        probabilidade: 0.5

  - nome: "Fila 2"
    servers: 2
    capacity: 4
    atendimento:
      min: 3
      max: 5
    # sem chegada externa, sem roteamento -> 100% para o exterior

  - nome: "Fila 3"
    servers: 3
    capacity: 5
    atendimento:
      min: 2
      max: 4
    # sem chegada externa, sem roteamento -> 100% para o exterior